<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Midnight Black -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070911" />
      <stop offset="50%" stop-color="#04050b" />
      <stop offset="100%" stop-color="#02030a" />
    </linearGradient>

    <!-- Primary Neon Gradient (Electric Cobalt -> Acid Lime) -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3fd4" />
      <stop offset="55%" stop-color="#3d6bff" />
      <stop offset="100%" stop-color="#c6ff00" />
    </linearGradient>

    <!-- Subtle Rim Border Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d6bff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7fa0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c6ff00" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glowing Accent Blur Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="113" ry="113" fill="none" stroke="url(#rimGlow)" stroke-width="5" />

  <!-- Ambient Backdrop Glow Behind Monogram -->
  <circle cx="256" cy="250" r="130" fill="#3d6bff" opacity="0.16" filter="url(#neonBlur)" />
  <circle cx="256" cy="300" r="110" fill="#c6ff00" opacity="0.10" filter="url(#neonBlur)" />

  <!-- The Architectural 'A' Monogram with Neural Circuit Interconnect -->
  <g filter="url(#softGlow)">
    <!-- Outer Chevron Architecture -->
    <path
      d="M256 124 L392 396 L332 396 L256 244 L180 396 L120 396 Z"
      fill="none"
      stroke="url(#primaryNeon)"
      stroke-width="16"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Central Bridge / Crossbar with Precision Tech Slit -->
    <path
      d="M168 326 L344 326"
      stroke="url(#primaryNeon)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Inner Core Delta Prism -->
    <polygon
      points="256,192 216,278 296,278"
      fill="none"
      stroke="#c6ff00"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Apex Neural Antenna Traces -->
    <line x1="256" y1="124" x2="256" y2="76" stroke="#3d6bff" stroke-width="9" stroke-linecap="round" />
    <circle cx="256" cy="70" r="13" fill="#3d6bff" filter="url(#neonBlur)" />

    <line x1="256" y1="104" x2="218" y2="82" stroke="#3d6bff" stroke-width="7" stroke-linecap="round" />
    <circle cx="214" cy="80" r="10" fill="#3d6bff" />

    <line x1="256" y1="104" x2="294" y2="82" stroke="#c6ff00" stroke-width="7" stroke-linecap="round" />
    <circle cx="298" cy="80" r="10" fill="#c6ff00" />

    <!-- Lateral Neural Circuit Branch Traces -->
    <line x1="172" y1="228" x2="132" y2="228" stroke="#3d6bff" stroke-width="7" stroke-linecap="round" />
    <circle cx="126" cy="228" r="9" fill="#3d6bff" />

    <line x1="340" y1="228" x2="380" y2="228" stroke="#c6ff00" stroke-width="7" stroke-linecap="round" />
    <circle cx="386" cy="228" r="9" fill="#c6ff00" />
  </g>
</svg>
