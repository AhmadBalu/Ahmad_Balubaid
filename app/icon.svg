<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Primary Neon Cyber Gradient (Mint -> Sky Blue -> Indigo) -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df5c8" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Rim Border Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0df5c8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glowing Accent Blur Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="113" ry="113" fill="none" stroke="url(#rimGlow)" stroke-width="5" />

  <!-- Ambient Backdrop Glow Behind Monogram -->
  <circle cx="256" cy="250" r="130" fill="#0df5c8" opacity="0.14" filter="url(#neonBlur)" />
  <circle cx="256" cy="300" r="110" fill="#38bdf8" opacity="0.12" filter="url(#neonBlur)" />

  <!-- The Architectural 'A' Monogram with Neural Circuit Interconnect -->
  <g filter="url(#softGlow)">
    <!-- Outer Chevron Architecture -->
    <path 
      d="M256 124 L392 396 L332 396 L256 244 L180 396 L120 396 Z" 
      fill="none" 
      stroke="url(#primaryNeon)" 
      stroke-width="16" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
    />
    
    <!-- Central Bridge / Crossbar with Precision Tech Slit -->
    <path 
      d="M168 326 L344 326" 
      stroke="url(#primaryNeon)" 
      stroke-width="14" 
      stroke-linecap="round" 
    />
    
    <!-- Inner Core Delta Prism -->
    <polygon 
      points="256,192 216,278 296,278" 
      fill="none" 
      stroke="#0df5c8" 
      stroke-width="10" 
      stroke-linejoin="round" 
    />

    <!-- Apex Neural Antenna Traces -->
    <line x1="256" y1="124" x2="256" y2="76" stroke="#0df5c8" stroke-width="9" stroke-linecap="round" />
    <circle cx="256" cy="70" r="13" fill="#0df5c8" filter="url(#neonBlur)" />

    <line x1="256" y1="104" x2="218" y2="82" stroke="#0df5c8" stroke-width="7" stroke-linecap="round" />
    <circle cx="214" cy="80" r="10" fill="#0df5c8" />

    <line x1="256" y1="104" x2="294" y2="82" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <circle cx="298" cy="80" r="10" fill="#38bdf8" />

    <!-- Lateral Neural Circuit Branch Traces -->
    <line x1="172" y1="228" x2="132" y2="228" stroke="#0df5c8" stroke-width="7" stroke-linecap="round" />
    <circle cx="126" cy="228" r="9" fill="#0df5c8" />

    <line x1="340" y1="228" x2="380" y2="228" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <circle cx="386" cy="228" r="9" fill="#38bdf8" />
  </g>
</svg>
